<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma bibliothèque</title>
<meta name="theme-color" content="#F1F3EF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bibliothèque">
<link rel="apple-touch-icon" href="icone-180.png">
<style>
:root{
  --papier:#F1F3EF;
  --carte:#FBFCFA;
  --encre:#171A18;
  --gris:#6C716C;
  --ligne:#DEE1DA;
  --oui:#1E6B4A;
  --alerte:#9A5B12;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--papier);color:var(--encre);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:4rem;
}
.wrap{max-width:52rem;margin:0 auto;padding:0 1rem}

/* ── en-tête + recherche ───────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:var(--papier);
  border-bottom:1px solid var(--ligne);padding-top:.9rem;
}
h1{
  font:400 1.05rem/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;
  margin:0 0 .1rem;letter-spacing:.01em;
}
.compte{font-size:.78rem;color:var(--gris);margin:0 0 .7rem}
.champ{position:relative;margin-bottom:.55rem}
#q{
  width:100%;padding:.72rem 2.2rem .72rem .8rem;
  border:1px solid var(--encre);border-radius:var(--r);
  background:var(--carte);color:var(--encre);
  font:400 1.05rem/1.3 Georgia,"Iowan Old Style",serif;
}
#q::placeholder{color:#9CA19B;font-style:italic}
#q:focus{outline:2px solid var(--encre);outline-offset:1px}
#vider{
  position:absolute;right:.35rem;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--gris);font-size:1.3rem;
  cursor:pointer;padding:.2rem .4rem;line-height:1;display:none;
}

/* ── tranche de bibliothèque ───────────────────────── */
.tranches{
  display:flex;gap:1px;height:26px;margin-bottom:.55rem;
  border-radius:2px;overflow:hidden;cursor:pointer;
}
.tranche{flex:1 1 auto;min-width:1px;opacity:.85;transition:opacity .12s}
.tranche.off{opacity:.16}

/* ── filtres ───────────────────────────────────────── */
.chips{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.7rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--ligne);background:var(--carte);
  color:var(--gris);border-radius:99px;padding:.28rem .6rem;
  font-size:.76rem;cursor:pointer;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--encre);color:var(--papier);border-color:var(--encre)}
.chip .pastille{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.35rem;vertical-align:1px}

/* ── onglets ───────────────────────────────────────── */
.onglets{display:flex;gap:1.1rem;border-bottom:1px solid var(--ligne);margin:.2rem 0 1rem}
.onglet{
  border:0;background:none;padding:.5rem 0;cursor:pointer;
  font-size:.85rem;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.onglet[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--encre)}

/* ── verdict anti-doublon ──────────────────────────── */
.verdict{
  display:none;align-items:baseline;gap:.5rem;
  padding:.65rem .8rem;border-radius:var(--r);margin-bottom:1rem;
  font-size:.9rem;border-left:3px solid;
}
.verdict.oui{display:flex;background:#E7F0E9;border-color:var(--oui);color:var(--oui)}
.verdict.non{display:flex;background:#F6EEE2;border-color:var(--alerte);color:var(--alerte)}
.verdict b{font-weight:600}

/* ── liste ─────────────────────────────────────────── */
.groupe{font-size:.72rem;color:var(--gris);margin:1.4rem 0 .5rem;
  padding-bottom:.25rem;border-bottom:1px solid var(--ligne)}
.groupe:first-child{margin-top:0}
.livre{
  background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);
  margin-bottom:.4rem;overflow:hidden;
}
.tete{
  display:flex;gap:.65rem;align-items:flex-start;width:100%;
  padding:.7rem .8rem;border:0;background:none;text-align:left;cursor:pointer;
  font:inherit;color:inherit;
}
.tete:focus-visible{outline:2px solid var(--encre);outline-offset:-2px}
.marque{flex:0 0 4px;align-self:stretch;border-radius:2px;min-height:2.2rem}
.txt{flex:1 1 auto;min-width:0}
.titre{
  font:400 1rem/1.3 Georgia,"Iowan Old Style",serif;margin:0 0 .1rem;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.livre.ouvert .titre{display:block;-webkit-line-clamp:unset} /* carte ouverte : titre entier */
.auteur{font-size:.8rem;color:var(--gris);margin:0}
.meta{font-size:.72rem;color:var(--gris);margin-top:.3rem}
.doute{color:var(--alerte)}
/* couverture */
.couv{
  flex:0 0 40px;height:58px;border-radius:2px;overflow:hidden;
  background:var(--papier);border:1px solid var(--ligne);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.couv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.couv span{font:400 .95rem Georgia,serif;color:#fff;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center}
.couv.grande{flex:0 0 96px;height:140px;margin-bottom:.5rem}

.detail{display:none;padding:0 .8rem .85rem 1.9rem;border-top:1px solid var(--ligne)}
.livre.ouvert .detail{display:block}
.detail h3{font-size:.72rem;color:var(--gris);font-weight:500;margin:.75rem 0 .35rem}
.detail ul{margin:0;padding-left:1rem}
.detail li{font-size:.88rem;margin-bottom:.25rem}
.note{
  width:100%;margin-top:.3rem;padding:.45rem .55rem;border:1px solid var(--ligne);
  border-radius:var(--r);background:var(--papier);font:inherit;font-size:.85rem;
  resize:vertical;min-height:2.6rem;color:inherit;
}
.resume{font-size:.88rem;line-height:1.55;margin:.15rem 0 0;max-width:62ch}
.resume.editeur{color:var(--gris)}
.isbn{
  display:flex;gap:.4rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;
}
.isbn input{
  flex:0 1 15ch;padding:.35rem .5rem;border:1px solid var(--ligne);
  border-radius:var(--r);background:var(--papier);color:inherit;
  font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;
}
.isbn a{color:var(--gris);font-size:.75rem}
.actions{margin-top:.6rem;display:flex;gap:.4rem;flex-wrap:wrap}

/* enrichissement */
.champlong{
  width:100%;max-width:34rem;margin-bottom:.3rem;padding:.42rem .55rem;
  border:1px solid var(--ligne);border-radius:var(--r);background:var(--papier);
  color:inherit;font:inherit;font-size:.88rem;
}
.champlong:focus,.isbn input:focus,.note:focus{outline:2px solid var(--encre);outline-offset:1px}
.lookup{font-size:.82rem;margin:.4rem 0 0;line-height:1.5;display:none}
.lookup.actif{display:block}
.lookup.ok{color:var(--oui)}
.lookup.ko{color:var(--alerte)}
.lookup button{margin-top:.35rem}

.enrich{
  border:1px solid var(--ligne);background:var(--carte);border-radius:var(--r);
  padding:.7rem .8rem;margin-bottom:1rem;font-size:.85rem;
}
.enrich p{margin:0 0 .5rem;color:var(--gris);line-height:1.5}
.jauge{height:4px;background:var(--ligne);border-radius:2px;overflow:hidden;margin:.5rem 0;display:none}
.jauge.actif{display:block}
.jauge i{display:block;height:100%;background:var(--oui);width:0}
.mini{
  border:1px solid var(--ligne);background:var(--papier);color:var(--gris);
  border-radius:99px;padding:.25rem .6rem;font-size:.74rem;cursor:pointer;
}
.mini[aria-pressed="true"]{background:var(--oui);border-color:var(--oui);color:#fff}

/* ── questions ─────────────────────────────────────── */
.qitem{
  display:block;width:100%;text-align:left;background:var(--carte);
  border:1px solid var(--ligne);border-radius:var(--r);
  padding:.6rem .75rem;margin-bottom:.35rem;cursor:pointer;font:inherit;color:inherit;
}
.qtexte{font:400 .95rem/1.35 Georgia,"Iowan Old Style",serif}
.qsource{
  font-size:.75rem;color:var(--gris);margin-top:.2rem;
  display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.vide{color:var(--gris);font-size:.9rem;padding:1.5rem 0;line-height:1.6}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--ligne);
  font-size:.75rem;color:var(--gris);line-height:1.7}
footer button{margin-right:.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Ma bibliothèque</h1>
  <p class="compte" id="compte"></p>
  <div class="champ">
    <input id="q" type="search" autocomplete="off" placeholder="Un titre, un auteur, ou une question…">
    <button id="vider" aria-label="Effacer la recherche">×</button>
  </div>
  <div class="tranches" id="tranches" title="Chaque trait est un livre — touchez pour filtrer"></div>
  <div class="chips" id="chips"></div>
  <div class="onglets" role="tablist">
    <button class="onglet" role="tab" data-vue="livres" aria-selected="true">Livres</button>
    <button class="onglet" role="tab" data-vue="questions" aria-selected="false">Questions</button>
    <button class="onglet" role="tab" data-vue="verifier" aria-selected="false">À vérifier</button>
  </div>
</header>

<div class="verdict" id="verdict"></div>

<section class="enrich" id="enrich">
  <p id="enrichEtat"></p>
  <div class="jauge" id="jauge"><i></i></div>
  <button class="mini" id="lancer">Compléter depuis Google Books</button>
  <button class="mini" id="arreter" hidden>Arrêter</button>
</section>

<main id="liste"></main>

<footer>
  <p id="etat"></p>
  <p>
    <button class="mini" id="exporter">Exporter mes notes</button>
    <button class="mini" id="importer">Importer des notes</button>
    <input type="file" id="fichier" accept="application/json" hidden>
  </p>
</footer>

</div>

// c: 1 = titre/auteur fiables, 0 = à vérifier sur l'étagère
const LIVRES = [

/* ─── ÉTAGÈRE 1 ─────────────────────────────────────────────── */
{t:"Event Design", r:"Méthode canvas pour concevoir un événement à partir de l'expérience visée et des objectifs business, plutôt qu'à partir d'un programme.", a:"Roel Frissen, Ruud Janssen, Dennis Luijer", th:"dt", s:1, c:1, q:["Comment concevoir un événement comme une expérience et pas comme un programme ?", "Comment aligner un événement sur un objectif business ?"]},
{t:"Design Thinking for Business Growth", r:"Lewrick relie le design thinking aux écosystèmes business : comment passer d'ateliers isolés à une capacité d'innovation qui produit de la croissance.", a:"Michael Lewrick", th:"dt", s:1, c:1, q:["Comment passer du design thinking à une stratégie de croissance ?", "Comment structurer une démarche d'innovation à l'échelle de l'entreprise ?"]},

{t:"Collaboration visuelle", r:"Les auteurs de Bigger Picture montrent comment un support visuel partagé fait penser un groupe — templates de murs et de conversations.", a:"Ole Qvist-Sørensen, Loa Baastrup", th:"dt", s:1, c:1, q:["Comment faire penser un groupe avec un support visuel ?", "Comment structurer un mur d'atelier ?"]},
{t:"Encyclopédie visuelle : 1400 dessins, croquis, pictos, crobards... au service de vos idées: 1400 dessins, croquis, pictos, crobards... au service de vos idées !", r:"Catalogue de 1 400 dessins, pictos et personnages à recopier pour se constituer un vocabulaire graphique. À feuilleter avant un atelier, pas à lire.", a:"Bernard Lebelle, Guillaume Lagane, Nicolas Gros", isbn:"9782212562163", th:"dt", s:1, c:1, q:["Quelle représentation graphique choisir pour tel type d'information ?"]},
{t:"Travailler avec le sketchnoting: Comment gagner en efficacité et en sérénité grâce à la pensée visuelle", re:"Le sketchnoting, aussi appelé prise de notes visuelle, est une manière créative de prendre des notes ou d'organiser les informations. C'est un outil de pensée visuelle qui permet de transformer tout types d'informations : vidéo, texte, conférence, cours... en une représentation graphique du texte, en y ajoutant des images, sur une seule page. Dans un contexte de travail qui s'alourdit, il est impératif d'alléger la masse d'informations à laquelle nous sommes soumis et de la simplifier pour évite", a:"Audrey Akoun, Philippe Boukobza, Isabelle Pailleau", isbn:"9782212565997", th:"dt", s:1, c:1, q:["Comment prendre des notes visuelles en réunion ?"]},

{t:"Les 5 outils pour réussir en équipe", re:"Les équipes ne sont pas performantes quand leurs membres travaillent chacun de leur côté, qu'ils ne se sentent pas en sécurité et que leurs activités ne sont pas alignées. La réussite d'une équipe dépend principalement des interactions journalières entre ses membres, à deux niveaux: les activités de l’équipe: tous les membres de l’équipe doit savoir quelle mission doit être effectuée par tous et surtout qui fait quoi; le climat dans lequel évolue l’équipe: il est indispensable pour réussir ensem", a:"Stefano MASTROGIACOMO, Alexander OSTERWALDER", isbn:"9782744067792", th:"cult", s:1, c:1, q:["Quels rituels de base pour une équipe qui démarre ?"]},
{t:"Bonne stratégie, mauvaise stratégie", r:"Rumelt oppose la stratégie réelle — diagnostic, ligne directrice, actions cohérentes — aux listes d'objectifs et de valeurs qui en tiennent lieu. Le meilleur livre de la pile sur le sujet.", a:"Richard Rumelt", th:"prod", s:1, c:1, q:["Qu'est-ce qui distingue une vraie stratégie d'une liste d'ambitions ?", "Comment diagnostiquer le vrai obstacle avant de décider ?", "Pourquoi notre stratégie ne dit-elle rien de concret ?"]},

{t:"Guide du Product Management: La référence de tous les product managers", a:"Marcel Venturino", isbn:"9782416008276", th:"prod", s:1, c:1, q:["Quelles sont les pratiques de base du product management ?"]},
{t:"Sense & Respond", r:"Gothelf et Seiden décrivent le management d'une entreprise en boucles courtes : décider, observer, ajuster — plutôt que planifier à l'année.", a:"Jeff Gothelf, Josh Seiden", th:"prod", s:1, c:1, q:["Comment diriger une organisation en apprentissage continu ?", "Comment remplacer les plans annuels par des boucles de feedback ?"]},
{t:"Making Ideas Happen", r:"Belsky s'intéresse à ce qui manque aux créatifs : l'exécution. Organisation des projets, forces communautaires, gestion de la récompense.", a:"Scott Belsky", th:"prodv", s:1, c:1, q:["Comment faire aboutir un projet créatif au lieu d'accumuler des idées ?", "Comment organiser le travail d'une équipe créative ?"]},
{t:"Mesurez ce qui compte", r:"Doerr raconte l'histoire des OKR d'Intel à Google, avec de nombreux cas d'entreprise. Fondateur mais parfois hagiographique.", a:"John Doerr", th:"prod", s:1, c:1, q:["Comment mettre en place des OKR ?", "Comment aligner des équipes sur des objectifs mesurables ?", "Comment distinguer un objectif d'un indicateur ?"]},

/* ── mémoire locale (notes + vérifications) ───────────── */
const CLE="biblio-notes-v1";
let perso={};
let stockageOK=true;
try{ perso=JSON.parse(localStorage.getItem(CLE)||"{}"); }
catch(e){ stockageOK=false; perso={}; }
function sauver(){
  if(!stockageOK) return;
  try{ localStorage.setItem(CLE,JSON.stringify(perso)); }
  catch(e){ stockageOK=false; majEtat(); }
}
function cle(l){ return l.t+"|"+l.a; }
/* la clé reste celle d'origine : corriger un titre ne perd pas les notes */
function titreDe(l){ const p=perso[cle(l)]||{}; return p.t||l.t; }
function auteurDe(l){ const p=perso[cle(l)]||{}; return p.a||l.a; }
function corrige(l){ const p=perso[cle(l)]||{}; return !!(p.t||p.a); }

const themeParId=Object.fromEntries(THEMES.map(t=>[t.id,t]));
LIVRES.forEach((l,i)=>l._i=i);

/* ── recherche ────────────────────────────────────────── */
const norm=s=>(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/['’\-–—.,:;!?()«»"]/g," ").replace(/\s+/g," ").trim();

function reindexer(l){
  l._idx=norm([titreDe(l),auteurDe(l),themeParId[l.th].nom,(l.q||[]).join(" ")].join(" "));
  l._idxCourt=norm(titreDe(l)+" "+auteurDe(l));
}
LIVRES.forEach(reindexer);

let etat={q:"",theme:null,vue:"livres"};

function filtrer(){
  const mots=norm(etat.q).split(" ").filter(Boolean);
  return LIVRES.filter(l=>{
    if(etat.theme && l.th!==etat.theme) return false;
    return mots.every(m=>l._idx.includes(m));
  });
}
/* correspondance stricte titre/auteur : sert au verdict anti-doublon */
function correspondancesTitre(){
  const mots=norm(etat.q).split(" ").filter(Boolean);
  if(!mots.length) return [];
  return LIVRES.filter(l=>mots.every(m=>l._idxCourt.includes(m)));
}

/* ── rendu ────────────────────────────────────────────── */
const $liste=document.getElementById("liste");
const $verdict=document.getElementById("verdict");

function majVerdict(){
  const q=etat.q.trim();
  if(q.length<3 || etat.vue!=="livres"){ $verdict.className="verdict"; return; }
  const exacts=correspondancesTitre();
  if(exacts.length){
    const l=exacts[0];
    $verdict.className="verdict oui";
    $verdict.innerHTML="<b>Tu l'as déjà.</b><span>"+echap(titreDe(l))+" — "+ETAGERES[l.s]+
      (exacts.length>1?" (+"+(exacts.length-1)+" autre"+(exacts.length>2?"s":"")+")":"")+"</span>";
  }else if(filtrer().length===0){
    $verdict.className="verdict non";
    $verdict.innerHTML="<b>Rien à ce titre.</b><span>Vérifie l'orthographe avant d'acheter — l'inventaire n'est pas garanti complet.</span>";
  }else{
    $verdict.className="verdict";
  }
}

const echap=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function vignette(l,grande){
  const th=themeParId[l.th], p=perso[cle(l)]||{};
  const cls="couv"+(grande?" grande":"");
  /* couverture Google Books si trouvée, sinon Open Library par ISBN
     (default=false → 404 si absente, et l'initiale réapparaît) */
  const isbn=p.isbn||l.isbn||"";
  const src=p.couv||(isbn
    ?`https://covers.openlibrary.org/b/isbn/${encodeURIComponent(isbn)}-M.jpg?default=false`
    :"");
  const img=src?`<img src="${echap(src)}" alt="" loading="lazy" onerror="this.remove()">`:"";
  return `<span class="${cls}" style="background:${th.couleur}"><span>${echap(titreDe(l)[0])}</span>${img}</span>`;
}

function carteLivre(l){
  const th=themeParId[l.th], p=perso[cle(l)]||{};
  const aVerifier=!l.c&&!p.ok;
  /* r = résumé rédigé (noir) ; p.resume / l.re = résumé éditeur (gris) */
  const resume=p.resume||l.r||l.re||"";
  const source=(!l.r&&(p.resume||l.re))?" editeur":"";
  const requete=encodeURIComponent(titreDe(l)+" "+auteurDe(l));
  return `<article class="livre" data-i="${l._i}">
    <button class="tete" aria-expanded="false">
      <span class="marque" style="background:${th.couleur}"></span>
      ${vignette(l,false)}
      <span class="txt">
        <span class="titre">${echap(titreDe(l))}</span>
        <p class="auteur">${echap(auteurDe(l))}</p>
        <p class="meta">${echap(th.nom)} · ${ETAGERES[l.s]}${
          l.dbl?` · <span class="doute">${echap(l.dbl)}</span>`:""}${
          aVerifier?' · <span class="doute">à vérifier</span>':(p.ok?" · vérifié":"")}${
          corrige(l)?" · corrigé":""}</p>
      </span>
    </button>
    <div class="detail">
      ${resume?`<h3>En deux lignes</h3><p class="resume${source}">${echap(resume)}</p>`:
        `<h3>En deux lignes</h3><p class="resume editeur">Pas encore de résumé — saisis l'ISBN ci-dessous pour le récupérer, ou écris le tien dans la note.</p>`}
      <h3>À consulter quand tu te demandes</h3>
      <ul>${(l.q||[]).map(q=>`<li>${echap(q)}</li>`).join("")}</ul>

      <h3>ISBN au dos du livre${p.isbnAuto?' — <span class="doute">trouvé par la recherche, à confirmer sur le livre</span>':""}</h3>
      <div class="isbn">
        <input class="cisbn" inputmode="numeric" placeholder="978…" value="${echap(p.isbn||l.isbn||"")}">
        <button class="mini blookup">Retrouver la fiche</button>
        <a href="https://www.google.com/search?q=${requete}+isbn" target="_blank" rel="noopener">chercher par titre</a>
      </div>
      <p class="lookup" data-r></p>

      <h3>Titre et auteur${aVerifier?" — à confirmer sur la couverture":""}</h3>
      <input class="ctitre champlong" value="${echap(titreDe(l))}" aria-label="Titre">
      <input class="cauteur champlong" value="${echap(auteurDe(l))}" aria-label="Auteur">

      <h3>Ma note</h3>
      <textarea class="note" placeholder="Ce que j'en ai retenu, à qui le prêter…">${echap(p.note||"")}</textarea>
      <div class="actions">
        <button class="mini bok" aria-pressed="${p.ok?"true":"false"}">${p.ok?"Vérifié":"Marquer comme vérifié"}</button>
        ${corrige(l)?`<button class="mini bannuler">Rétablir ma lecture d'origine</button>`:""}
      </div>
    </div>
  </article>`;
}

function rendre(){
  majVerdict();
  const res=filtrer();
  document.getElementById("vider").style.display=etat.q?"block":"none";

  if(etat.vue==="questions"){
    const mots=norm(etat.q).split(" ").filter(Boolean);
    let paires=[];
    res.forEach(l=>(l.q||[]).forEach(q=>{
      if(!mots.length||mots.every(m=>norm(q).includes(m))||mots.every(m=>l._idxCourt.includes(m)))
        paires.push([q,l]);
    }));
    paires.sort((a,b)=>a[0].localeCompare(b[0],"fr"));
    $liste.innerHTML=paires.length?paires.map(([q,l])=>
      `<button class="qitem" data-i="${l._i}">
         <span class="qtexte">${echap(q)}</span>
         <span class="qsource">${echap(titreDe(l))} — ${echap(auteurDe(l))}</span>
       </button>`).join("")
      :`<p class="vide">Aucune question ne correspond. Essaie un mot plus général : feedback, recruter, stratégie, changement…</p>`;
    majCompte(paires.length+" question"+(paires.length>1?"s":""));
    return;
  }

  if(etat.vue==="verifier"){
    const aVerif=res.filter(l=>!l.c&&!(perso[cle(l)]||{}).ok);
    $liste.innerHTML=aVerif.length
      ? `<p class="vide">Titres ou auteurs dont je ne suis pas sûr : je les ai lus sur une photo, et pour la plupart le nom de l'auteur n'était pas imprimé sur la tranche.<br><br>Le plus rapide : prends le livre, recopie l'ISBN au dos, appuie sur « Retrouver la fiche ». Titre, auteur, couverture et résumé se remplissent, et le livre sort de cette liste. Sinon, corrige à la main et marque-le vérifié.</p>`
        +aVerif.map(carteLivre).join("")
      : `<p class="vide">Plus rien à vérifier.</p>`;
    majCompte(aVerif.length+" à vérifier");
    return;
  }

  if(!res.length){
    $liste.innerHTML=`<p class="vide">Aucun livre ne correspond.</p>`;
    majCompte("0 livre");
    return;
  }
  const parEtagere={};
  res.forEach(l=>(parEtagere[l.s]=parEtagere[l.s]||[]).push(l));
  $liste.innerHTML=Object.keys(parEtagere).sort().map(s=>
    `<h2 class="groupe">${ETAGERES[s]} · ${parEtagere[s].length}</h2>`+
    parEtagere[s].sort((a,b)=>titreDe(a).localeCompare(titreDe(b),"fr")).map(carteLivre).join("")
  ).join("");
  majCompte(res.length+" livre"+(res.length>1?"s":""));
}

function majCompte(txt){
  document.getElementById("compte").textContent=
    txt+(etat.theme?" · "+themeParId[etat.theme].nom:"")+" · "+LIVRES.length+" au total";
}
function majEtat(){
  document.getElementById("etat").textContent=stockageOK
    ? "Tes notes sont enregistrées dans ce navigateur. Exporte-les avant de changer d'appareil."
    : "Ce navigateur bloque l'enregistrement local : tes notes disparaîtront en fermant l'onglet. Exporte-les avant de partir.";
}

/* ── tranche de bibliothèque ──────────────────────────── */
function rendreTranches(){
  document.getElementById("tranches").innerHTML=
    LIVRES.slice().sort((a,b)=>a.s-b.s||a.th.localeCompare(b.th)).map(l=>
      `<span class="tranche${etat.theme&&l.th!==etat.theme?" off":""}"
        style="background:${themeParId[l.th].couleur}" data-th="${l.th}"
        title="${echap(titreDe(l))}"></span>`).join("");
}

/* ── filtres ──────────────────────────────────────────── */
document.getElementById("chips").innerHTML=THEMES.map(t=>{
  const n=LIVRES.filter(l=>l.th===t.id).length;
  return `<button class="chip" data-th="${t.id}" aria-pressed="false">
    <span class="pastille" style="background:${t.couleur}"></span>${t.nom} ${n}</button>`;
}).join("");

function basculerTheme(id){
  etat.theme = etat.theme===id ? null : id;
  document.querySelectorAll(".chip").forEach(c=>
    c.setAttribute("aria-pressed", c.dataset.th===etat.theme ? "true":"false"));
  rendreTranches(); rendre();
}

/* ── événements ───────────────────────────────────────── */
document.getElementById("chips").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(c) basculerTheme(c.dataset.th);
});
document.getElementById("tranches").addEventListener("click",e=>{
  const t=e.target.closest(".tranche"); if(t) basculerTheme(t.dataset.th);
});
document.getElementById("q").addEventListener("input",e=>{etat.q=e.target.value;rendre();});
document.getElementById("vider").addEventListener("click",()=>{
  etat.q="";document.getElementById("q").value="";rendre();document.getElementById("q").focus();
});
document.querySelectorAll(".onglet").forEach(o=>o.addEventListener("click",()=>{
  etat.vue=o.dataset.vue;
  document.querySelectorAll(".onglet").forEach(x=>x.setAttribute("aria-selected",x===o?"true":"false"));
  rendre();
}));

$liste.addEventListener("click",e=>{
  const q=e.target.closest(".qitem");
  if(q){
    etat.vue="livres";
    document.querySelectorAll(".onglet").forEach(x=>
      x.setAttribute("aria-selected",x.dataset.vue==="livres"?"true":"false"));
    const l=LIVRES[+q.dataset.i];
    etat.q=titreDe(l); etat.theme=null;
    document.getElementById("q").value=titreDe(l);
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
    rendreTranches(); rendre();
    const art=$liste.querySelector('.livre[data-i="'+l._i+'"]');
    if(art){art.classList.add("ouvert");art.querySelector(".tete").setAttribute("aria-expanded","true");}
    return;
  }
  const tete=e.target.closest(".tete");
  if(tete){
    const art=tete.closest(".livre");
    const ouvert=art.classList.toggle("ouvert");
    tete.setAttribute("aria-expanded",ouvert?"true":"false");
    return;
  }
  const bok=e.target.closest(".bok");
  if(bok){
    const l=LIVRES[+bok.closest(".livre").dataset.i];
    const p=perso[cle(l)]=perso[cle(l)]||{};
    p.ok=!p.ok; sauver(); rendre();
  }
});
$liste.addEventListener("input",e=>{
  const art=e.target.closest(".livre"); if(!art) return;
  const l=LIVRES[+art.dataset.i];
  const p=perso[cle(l)]=perso[cle(l)]||{};
  const t=e.target;
  if(t.classList.contains("note")) p.note=t.value;
  else if(t.classList.contains("cisbn")){
    /* saisi livre en main : provenance fiable */
    p.isbn=t.value.replace(/[^0-9Xx]/g,""); delete p.isbnAuto;
  }
  else if(t.classList.contains("ctitre")){
    p.t = t.value.trim()===l.t ? undefined : t.value.trim();
    art.querySelector(".titre").textContent=titreDe(l); reindexer(l);
  }
  else if(t.classList.contains("cauteur")){
    p.a = t.value.trim()===l.a ? undefined : t.value.trim();
    art.querySelector(".auteur").textContent=auteurDe(l); reindexer(l);
  }
  else return;
  sauver();
});

/* ── retrouver une fiche à partir de l'ISBN ─────────────── */
/* Google Books d'abord (fiches plus complètes), Open Library en repli —
   notamment quand le quota journalier de Google est épuisé. L'ISBN étant
   une clé exacte, le repli ne risque pas de renvoyer un autre livre. */
async function parISBN(isbn){
  try{
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}&country=FR`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d.items&&d.items.length){
      const v=d.items[0].volumeInfo||{};
      return {
        t:v.title+(v.subtitle?" : "+v.subtitle:""),
        a:(v.authors||[]).join(", "),
        an:v.publishedDate||"",
        couv:((v.imageLinks||{}).thumbnail||"").replace(/^http:/,"https:"),
        resume:(v.description||"").slice(0,400)
      };
    }
  }catch(e){ /* quota ou réseau : on tente Open Library */ }
  return parISBNOpenLibrary(isbn);
}

async function parISBNOpenLibrary(isbn){
  const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${encodeURIComponent(isbn)}&format=json&jscmd=data`);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json();
  const v=d["ISBN:"+isbn];
  if(!v) return null;
  return {
    t:v.title||"",
    a:(v.authors||[]).map(x=>x.name).join(", "),
    an:v.publish_date||"",
    couv:(((v.cover||{}).medium)||"").replace(/^http:/,"https:"),
    resume:"",
    source:"fiche Open Library"
  };
}

let propositions={};

$liste.addEventListener("click",async e=>{
  const bl=e.target.closest(".blookup");
  if(bl){
    const art=bl.closest(".livre"), l=LIVRES[+art.dataset.i];
    const isbn=(art.querySelector(".cisbn").value||"").replace(/[^0-9Xx]/g,"");
    const zone=art.querySelector(".lookup");
    if(isbn.length!==10&&isbn.length!==13){
      zone.className="lookup actif ko";
      zone.textContent="Un ISBN fait 10 ou 13 chiffres. Recopie celui du code-barres au dos.";
      return;
    }
    zone.className="lookup actif"; zone.textContent="Recherche…";
    try{
      const f=await parISBN(isbn);
      if(!f){
        zone.className="lookup actif ko";
        zone.textContent="Aucune fiche pour cet ISBN. Vérifie le chiffre à chiffre, ou corrige le titre à la main ci-dessous.";
        return;
      }
      propositions[l._i]=f;
      zone.className="lookup actif ok";
      zone.innerHTML=`Trouvé : <strong>${echap(f.t)}</strong>${f.a?" — "+echap(f.a):""}${f.an?" ("+echap(f.an.slice(0,4))+")":""}${f.source?" · "+echap(f.source):""}
        <br><button class="mini bappliquer">Remplacer par cette fiche</button>`;
    }catch(err){
      zone.className="lookup actif ko";
      zone.textContent="Recherche impossible — ni Google Books ni Open Library n'ont répondu. Vérifie ta connexion. L'ISBN saisi reste enregistré : tu peux corriger le titre à la main et réessayer plus tard.";
    }
    return;
  }

  const ba=e.target.closest(".bappliquer");
  if(ba){
    const art=ba.closest(".livre"), l=LIVRES[+art.dataset.i], f=propositions[l._i];
    if(!f) return;
    const p=perso[cle(l)]=perso[cle(l)]||{};
    if(f.t) p.t=f.t;
    if(f.a) p.a=f.a;
    if(f.couv) p.couv=f.couv;
    if(f.resume && !l.r) p.resume=f.resume;
    p.ok=true; delete p.introuvable;
    reindexer(l); sauver(); rendre(); majEnrich();
    return;
  }

  const ban=e.target.closest(".bannuler");
  if(ban){
    const l=LIVRES[+ban.closest(".livre").dataset.i];
    const p=perso[cle(l)]||{};
    delete p.t; delete p.a; reindexer(l); sauver(); rendre();
    return;
  }
});

/* ── enrichissement en ligne (ISBN, couverture, résumé) ── */
let enCours=false;

function resteAFaire(){
  return LIVRES.filter(l=>{ const p=perso[cle(l)]||{}; return !p.isbn && !l.isbn && !p.couv && !p.introuvable; });
}
function majEnrich(){
  const reste=resteAFaire().length;
  const faits=LIVRES.filter(l=>(perso[cle(l)]||{}).isbn||l.isbn).length;
  const rates=LIVRES.filter(l=>(perso[cle(l)]||{}).introuvable).length;
  document.getElementById("enrichEtat").innerHTML= reste===0
    ? `Enrichissement terminé : ${faits} livres avec ISBN${rates?`, ${rates} introuvables — souvent le signe que le titre est mal orthographié dans la liste.`:"."}`
    : `${faits} livres complétés, ${reste} à faire${rates?`, ${rates} introuvables`:""}. Une connexion est nécessaire ; l'opération prend environ ${Math.ceil(reste*0.6/60)} minute(s) et se reprend là où elle s'arrête.`;
  document.getElementById("lancer").textContent = reste===0 ? "Relancer sur les introuvables" : "Compléter depuis Google Books";
}

async function chercherLivre(l){
  const q=encodeURIComponent(`intitle:${titreDe(l).split("(")[0].trim()} inauthor:${auteurDe(l).split(",")[0].split("(")[0].trim()}`);
  const url=`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=3&langRestrict=fr&country=FR`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json();
  if(!d.items||!d.items.length) return null;
  const v=d.items[0].volumeInfo||{};
  const ids=v.industryIdentifiers||[];
  const isbn=(ids.find(i=>i.type==="ISBN_13")||ids.find(i=>i.type==="ISBN_10")||{}).identifier||"";
  const couv=(v.imageLinks||{}).thumbnail||"";
  return {
    isbn,
    couv: couv.replace(/^http:/,"https:"),
    resume: (v.description||"").slice(0,400),
    trouve: v.title||""
  };
}

async function enrichir(){
  if(enCours) return;
  enCours=true;
  const btn=document.getElementById("lancer"), stop=document.getElementById("arreter");
  const jauge=document.getElementById("jauge");
  btn.disabled=true; stop.hidden=false; jauge.classList.add("actif");
  let liste=resteAFaire();
  if(!liste.length) liste=LIVRES.filter(l=>(perso[cle(l)]||{}).introuvable);
  const total=liste.length;
  let panne=false;
  for(let i=0;i<total;i++){
    if(!enCours) break;
    const l=liste[i];
    const p=perso[cle(l)]=perso[cle(l)]||{};
    try{
      const res=await chercherLivre(l);
      if(res){
        if(res.isbn && !p.isbn){ p.isbn=res.isbn; p.isbnAuto=true; } /* recherche floue : à confirmer livre en main */
        if(res.couv && !p.couv) p.couv=res.couv;
        if(res.resume && !l.r && !p.resume) p.resume=res.resume;
        delete p.introuvable;
      }else{ p.introuvable=true; }
    }catch(e){
      /* erreur réseau ou quota : ce n'est pas un livre introuvable, on s'arrête */
      panne=true; break;
    }
    sauver();
    jauge.firstElementChild.style.width=Math.round((i+1)/total*100)+"%";
    document.getElementById("enrichEtat").textContent=`${i+1} / ${total} — ${titreDe(l)}`;
    await new Promise(r=>setTimeout(r,600));
  }
  enCours=false; btn.disabled=false; stop.hidden=true;
  jauge.classList.remove("actif"); jauge.firstElementChild.style.width="0";
  if(panne){
    document.getElementById("enrichEtat").textContent=
      "Google Books a refusé la requête — quota journalier épuisé (remis à zéro chaque jour vers 9h) ou connexion coupée. Rien n'a été marqué introuvable : relance plus tard, la reprise se fera ici.";
  }else{ majEnrich(); }
  rendre();
}
document.getElementById("lancer").addEventListener("click",enrichir);
document.getElementById("arreter").addEventListener("click",()=>{enCours=false;});

/* ── export / import ──────────────────────────────────── */
document.getElementById("exporter").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(perso,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="biblio-notes.json";a.click();URL.revokeObjectURL(a.href);
});
document.getElementById("importer").addEventListener("click",()=>document.getElementById("fichier").click());
document.getElementById("fichier").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{ perso=Object.assign(perso,JSON.parse(r.result)); sauver(); rendre(); }
    catch(err){ alert("Ce fichier n'est pas un export de notes valide."); }
  };
  r.readAsText(f);
});

rendreTranches(); rendre(); majEtat(); majEnrich();

/* ── PWA : hors ligne + installation sur l'écran d'accueil ── */
/* Le fichier reste ouvrable tel quel (file://) : on ne s'enregistre qu'en HTTP(S). */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
